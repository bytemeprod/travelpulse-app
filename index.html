<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TravelPulse — Авторизация</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <header class="header">
    <div class="logo">✈ TravelPulse</div>
    <button class="nav-toggle">☰</button>
    <ul class="nav-menu">
      <li><a href="catalog.html">Каталог</a></li>
      <li><a href="details.html">Детализация</a></li>
      <li><a href="index.html">Вход</a></li>
    </ul>
  </header>
  <main class="main-container">
    <div class="split-auth">
      <div class="split-banner">
        <h2>Откройте мир с TravelPulse</h2>
        <p>Лучшие туры и горящие предложения по всему миру.</p>
      </div>
      <div class="split-form auth-card">
        <h1 class="auth-title">Вход в систему</h1>
        <form action="catalog.html">
          <div class="form-group">
            <label for="email">Email адрес</label>
            <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary">Войти в аккаунт</button>
        </form>
      </div>
    </div>
  </main>
  <footer class="footer">
    &copy; 2026 TravelPulse. Все права защищены.
  </footer>
  <script src="js/app.min.js"></script>
</body>
</html>
