<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TravelPulse — Каталог туров</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <header class="header">
    <div class="logo">✈ TravelPulse</div>
    <button class="nav-toggle">☰</button>
    <ul class="nav-menu">
      <li><a href="catalog.html">Каталог</a></li>
      <li><a href="details.html">Детализация</a></li>
      <li><a href="index.html">Выход</a></li>
    </ul>
  </header>
  <main class="main-container">
    <div class="search-bar">
      <input type="text" class="form-control" placeholder="Поиск направления или отеля...">
      <button class="btn-primary" style="width: auto;">Найти</button>
    </div>
    <section class="tour-grid">
      <article class="tour-card">
        <div class="tour-img-placeholder">🏝️ Мальдивы</div>
        <div class="tour-content">
          <h3>Мальдивы: Резорт на воде</h3>
          <p class="tour-price">$1,299 / чел</p>
          <a href="details.html" class="btn-primary" style="display:inline-block; text-align:center; margin-top:0.5rem;">Подробнее</a>
        </div>
      </article>
      <article class="tour-card">
        <div class="tour-img-placeholder">🌋 Бали</div>
        <div class="tour-content">
          <h3>Бали: Экскурсии и серфинг</h3>
          <p class="tour-price">$850 / чел</p>
          <a href="details.html" class="btn-primary" style="display:inline-block; text-align:center; margin-top:0.5rem;">Подробнее</a>
        </div>
      </article>
      <article class="tour-card">
        <div class="tour-img-placeholder">⛩️ Киото</div>
        <div class="tour-content">
          <h3>Япония: Культурный тур</h3>
          <p class="tour-price">$1,450 / чел</p>
          <a href="details.html" class="btn-primary" style="display:inline-block; text-align:center; margin-top:0.5rem;">Подробнее</a>
        </div>
      </article>
    </section>
  </main>
  <footer class="footer">
    &copy; 2026 TravelPulse. Все права защищены.
  </footer>
</body>
</html>
